name: sdp

services:
  postgres:
    # O projeto pgvector não publica variante Alpine para PostgreSQL 17.
    image: pgvector/pgvector:pg17
    container_name: sdp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sdp
      POSTGRES_PASSWORD: sdp
      POSTGRES_DB: sdp
    ports:
      - "5432:5432"
    volumes:
      - sdp-postgres-data:/var/lib/postgresql/data
      - ./apps/api-ts/prisma/init.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdp -d sdp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sdp-postgres-data:
