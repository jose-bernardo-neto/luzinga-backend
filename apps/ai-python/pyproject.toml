[project]
name = "luzinga-ai"
version = "0.1.0"
description = "Serviço de visão computacional e face matching da plataforma Luzinga."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "numpy>=1.26.0",
  "opencv-python-headless>=4.10.0",
  "insightface>=0.7.3",
  "onnxruntime>=1.19.0",
  "pgvector>=0.3.0",
  "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
]
